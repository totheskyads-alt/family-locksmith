<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Locksmith — Design Options</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F5A524'/%3E%3Cg transform='rotate(45 50 50)' fill='%231B1D22'%3E%3Ccircle cx='50' cy='31' r='12.5' fill='none' stroke='%231B1D22' stroke-width='7'/%3E%3Crect x='46' y='39' width='8' height='34'/%3E%3Crect x='54' y='58' width='10' height='6.5'/%3E%3Crect x='54' y='67' width='7.5' height='6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#F5A524">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:"Manrope",-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#0f0f12}
  .disp{font-family:"Archivo","Manrope",Arial,sans-serif}
  .ribbon{padding:14px clamp(18px,4vw,40px);background:#141418;color:#fff;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-top:1px solid #2a2a30}
  .ribbon b{font-family:"Archivo";font-weight:800;font-size:15px;letter-spacing:.01em}
  .ribbon span{color:#9b978d;font-size:13.5px}
  .ribbon .tag{background:#F5A524;color:#3E2803;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}

  /* ---- themed component (vars drive palette) ---- */
  .theme{background:var(--bg);color:var(--text);position:relative;overflow:hidden}
  .wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
  .head{display:flex;align-items:center;justify-content:space-between;height:74px;gap:20px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo svg{width:42px;height:42px;border-radius:11px;flex:none}
  .lw{display:flex;flex-direction:column;line-height:.92}
  .lw .l1{font-weight:600;font-size:10.5px;letter-spacing:.34em;color:var(--l1)}
  .lw .l2{font-family:"Archivo";font-weight:800;font-size:19px;color:var(--l2)}
  .nav{display:flex;gap:26px}
  .nav a{font-size:15px;font-weight:600;color:var(--navText);text-decoration:none}
  .nav a.on{color:var(--text)}
  .hcta{display:flex;align-items:center;gap:12px}
  .phone{display:flex;align-items:center;gap:8px;font-family:"Archivo";font-weight:800;color:var(--text);font-size:16px}
  .phone .ic{width:32px;height:32px;border-radius:50%;background:var(--accentSoft);color:var(--accentDeep);display:grid;place-items:center}
  .phone .ic svg{width:16px;height:16px}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:12px 20px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;transition:transform .18s}
  .btn:hover{transform:translateY(-2px)}
  .btn svg{width:18px;height:18px}
  .btn-a{background:var(--accent);color:var(--accentInk);box-shadow:0 16px 34px -16px var(--accentShadow)}
  .btn-wa{background:#25D366;color:#04220f}
  .btn-lg{font-size:17px;padding:16px 28px}

  .hero{position:relative;z-index:2;padding:clamp(40px,6vw,86px) 0 clamp(46px,6vw,84px)}
  .hgrid{display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(28px,5vw,64px);align-items:center}
  .eye{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accentDeep)}
  .eye .d{width:9px;height:9px;border-radius:50%;background:#3ED598}
  h1{font-family:"Archivo";font-weight:900;letter-spacing:-.03em;line-height:1.02;font-size:clamp(36px,5.6vw,66px);margin:14px 0 0;color:var(--headline)}
  h1 .hl{color:var(--hl)}
  .lead{margin-top:20px;font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:37ch;line-height:1.6}
  .lead b{color:var(--headline)}
  .row{display:flex;flex-wrap:wrap;gap:13px;margin-top:28px}
  .chips{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:26px}
  .chip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:600}
  .chip svg{width:17px;height:17px;color:var(--accentDeep)}

  .vis{position:relative;min-height:320px;display:grid;place-items:center}
  .card{position:relative;width:100%;max-width:400px;aspect-ratio:1/1.02;border-radius:28px;background:var(--heroCard);border:1px solid var(--cardBorder);box-shadow:0 26px 54px -26px var(--cardShadow);display:grid;place-items:center;overflow:hidden}
  .card .key{width:52%;position:relative;z-index:2}
  .fl{position:absolute;z-index:4;background:var(--fl);border:1px solid var(--flBorder);border-radius:15px;padding:12px 15px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
  .fl1{top:6%;left:-3%;display:flex;align-items:center;gap:10px}
  .fl1 .dot{width:10px;height:10px;border-radius:50%;background:#3ED598}
  .fl1 .t{font-size:12.5px;font-weight:700;color:var(--flText)}
  .fl1 .s{font-size:11px;color:var(--flMuted)}
  .fl2{bottom:5%;right:-4%}
  .fl2 .st{color:var(--accent);font-size:13px;letter-spacing:2px}
  .fl2 .big{font-family:"Archivo";font-weight:800;font-size:21px;color:var(--flText);line-height:1}
  .fl2 .s{font-size:11.5px;color:var(--flMuted)}

  .trust{border-top:1px solid var(--line);background:var(--bg2)}
  .tgrid{display:grid;grid-template-columns:repeat(4,1fr)}
  .ti{display:flex;align-items:center;gap:12px;padding:22px 20px;border-right:1px solid var(--line)}
  .ti:last-child{border-right:none}
  .ti .ic{width:38px;height:38px;border-radius:10px;background:var(--accentSoft);color:var(--accentDeep);display:grid;place-items:center;flex:none}
  .ti .ic svg{width:20px;height:20px}
  .ti .t{font-family:"Archivo";font-weight:800;color:var(--headline);font-size:15px;line-height:1.1}
  .ti .s{font-size:12.5px;color:var(--muted)}

  /* ================= THEME A — WARM & LIGHT ================= */
  .t-warm{--bg:#FAF6EE;--bg2:#F2EADB;--text:#241E17;--headline:#241E17;--muted:#6E6357;--accent:#F5A524;--accentDeep:#C0730B;--accentInk:#3E2803;--accentSoft:#FBEBCF;--accentShadow:rgba(234,143,12,.42);--line:#EAE1D0;--hl:#C0730B;--l1:#6E6357;--l2:#241E17;--navText:#6E6357;--heroCard:linear-gradient(158deg,#FEF3DB,#FBDDA6);--cardBorder:#DECFB4;--cardShadow:rgba(74,46,2,.3);--fl:#fff;--flBorder:#EAE1D0;--flText:#241E17;--flMuted:#6E6357}
  .t-warm .hero::before{content:"";position:absolute;top:-24%;right:-8%;width:60vw;height:60vw;max-width:680px;max-height:680px;background:radial-gradient(circle,rgba(245,165,36,.26),transparent 62%)}
  .t-warm .hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(74,46,2,.03) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(74,46,2,.03) 0 1px,transparent 1px 46px)}

  /* ================= THEME B — BOLD DARK ================= */
  .t-dark{--bg:#0C0C0E;--bg2:#121217;--text:#ECEAE3;--headline:#ffffff;--muted:#A4A096;--accent:#F5A524;--accentDeep:#F5A524;--accentInk:#241a06;--accentSoft:rgba(245,165,36,.14);--accentShadow:rgba(245,165,36,.5);--line:#292A32;--hl:#F5A524;--l1:#F6F2E9;--l2:#F5A524;--navText:#A4A096;--heroCard:linear-gradient(155deg,#1b1d24,#111116);--cardBorder:#34363F;--cardShadow:rgba(0,0,0,.7);--fl:rgba(20,21,26,.92);--flBorder:#34363F;--flText:#fff;--flMuted:#A4A096}
  .t-dark .hero::before{content:"";position:absolute;top:-28%;right:-10%;width:66vw;height:66vw;max-width:760px;max-height:760px;background:radial-gradient(circle,rgba(245,147,16,.18),transparent 62%)}
  .t-dark .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,var(--bg) 97%),repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 46px),repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,transparent 1px 46px)}
  .t-dark .card .key g{fill:#F5A524}
  .t-dark .card .key circle{stroke:#F5A524}

  /* ================= THEME C — CLEAN WHITE ================= */
  .t-white{--bg:#FFFFFF;--bg2:#F7F8FA;--text:#191A1E;--headline:#101116;--muted:#65676E;--accent:#F5A524;--accentDeep:#B4770A;--accentInk:#3E2803;--accentSoft:#FDF0D8;--accentShadow:rgba(245,165,36,.35);--line:#ECECEF;--hl:#B4770A;--l1:#65676E;--l2:#191A1E;--navText:#65676E;--heroCard:#FFFFFF;--cardBorder:#ECECEF;--cardShadow:rgba(20,22,40,.16);--fl:#fff;--flBorder:#ECECEF;--flText:#191A1E;--flMuted:#65676E}
  .t-white .card{background:linear-gradient(160deg,#FFFFFF,#F7F8FA)}
  .t-white .card::before{content:"";position:absolute;width:150%;height:60%;top:-12%;left:-25%;background:radial-gradient(ellipse at center,rgba(245,165,36,.16),transparent 60%)}
  .t-white .card .key g{fill:#F5A524}
  .t-white .card .key circle{stroke:#F5A524}
  .t-white .hero::before{content:"";position:absolute;top:-24%;right:-8%;width:58vw;height:58vw;max-width:640px;max-height:640px;background:radial-gradient(circle,rgba(245,165,36,.14),transparent 62%)}

  @media (max-width:960px){
    .nav,.phone{display:none}
    .hgrid{grid-template-columns:1fr;gap:36px}.vis{order:-1}
    .tgrid{grid-template-columns:repeat(2,1fr)}
    .ti:nth-child(2){border-right:none}.ti:nth-child(1),.ti:nth-child(2){border-bottom:1px solid var(--line)}
  }
  @media (max-width:560px){.tgrid{grid-template-columns:1fr}.ti{border-right:none}.ti{border-bottom:1px solid var(--line)}}
</style>
</head>
<body>

<div id="tmpl" style="display:none"></div>

<script>
  const PHONE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.94.36 1.85.68 2.72a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.36-1.36a2 2 0 0 1 2.11-.45c.87.32 1.78.55 2.72.68A2 2 0 0 1 22 16.92z"/></svg>';
  const WA_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"/></svg>';
  const LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#F5A524"/><g transform="rotate(45 50 50)" fill="#1B1D22"><circle cx="50" cy="31" r="12.5" fill="none" stroke="#1B1D22" stroke-width="7"/><rect x="46" y="39" width="8" height="34"/><rect x="54" y="58" width="10" height="6.5"/><rect x="54" y="67" width="7.5" height="6"/></g></svg>';
  const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
  const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  const SHIELD='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
  const NOFEE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>';
  const GUAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>';
  const KEY='<svg class="key" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(45 50 50)" fill="#26201A"><circle cx="50" cy="28" r="15" fill="none" stroke="#26201A" stroke-width="9"/><rect x="45" y="38" width="10" height="42" rx="1"/><rect x="55" y="60" width="12" height="8"/><rect x="55" y="71" width="9" height="7"/></g></svg>';

  function block(theme){
    return `<div class="theme ${theme}">
      <div class="wrap">
        <div class="head">
          <a class="logo" href="#">${LOGO}<span class="lw"><span class="l1">FAMILY</span><span class="l2">LOCKSMITH</span></span></a>
          <nav class="nav"><a class="on" href="#">Home</a><a href="#">Services</a><a href="#">Areas</a><a href="#">About</a><a href="#">Reviews</a><a href="#">Contact</a></nav>
          <div class="hcta"><span class="phone"><span class="ic">${PHONE_SVG}</span>07597 379838</span><a class="btn btn-a" href="#">${PHONE_SVG}Call now</a></div>
        </div>
      </div>
      <div class="wrap hero">
        <div class="hgrid">
          <div>
            <span class="eye"><span class="d"></span> Available now · 24/7</span>
            <h1>Locked out? A locksmith is <span class="hl">on the way.</span></h1>
            <p class="lead">Fast, friendly and fully-insured locksmiths covering <b>all of England</b>. Lockouts, lock changes, uPVC door repairs and burglary repairs, <b>no call-out charge</b>, price agreed before we start.</p>
            <div class="row"><a class="btn btn-a btn-lg" href="#">${PHONE_SVG}Call now</a><a class="btn btn-wa btn-lg" href="#">${WA_SVG}WhatsApp us</a></div>
            <div class="chips"><span class="chip">${CLOCK} ~25 min response</span><span class="chip">${CHECK} No call-out charge</span><span class="chip">${SHIELD} Fully insured &amp; DBS-checked</span></div>
          </div>
          <div class="vis"><div class="card">${KEY}
            <div class="fl fl1"><span class="dot"></span><div><div class="t">Locksmith en route</div><div class="s">Arriving in ~22 min</div></div></div>
            <div class="fl fl2"><div class="st">★★★★★</div><div class="big">4.9/5</div><div class="s">from 600+ reviews</div></div>
          </div></div>
        </div>
      </div>
      <div class="trust"><div class="wrap"><div class="tgrid">
        <div class="ti"><span class="ic">${CLOCK}</span><div><div class="t">~25 minutes</div><div class="s">Typical response</div></div></div>
        <div class="ti"><span class="ic">${NOFEE}</span><div><div class="t">No call-out charge</div><div class="s">Price upfront</div></div></div>
        <div class="ti"><span class="ic">${SHIELD}</span><div><div class="t">Fully insured</div><div class="s">DBS-checked</div></div></div>
        <div class="ti"><span class="ic">${GUAR}</span><div><div class="t">12-month guarantee</div><div class="s">Parts &amp; work</div></div></div>
      </div></div></div>
    </div>`;
  }

  const options=[
    {t:'t-warm', tag:'Option A', name:'Warm &amp; light', note:'the version that is live now'},
    {t:'t-dark', tag:'Option B', name:'Bold — amber on black', note:'your previous look, with the current info'},
    {t:'t-white', tag:'Option C', name:'Clean white', note:'minimal, bright, professional'},
  ];
  document.body.insertAdjacentHTML('beforeend', options.map(o=>
    `<div class="ribbon"><span class="tag">${o.tag}</span><b>${o.name}</b><span>— ${o.note}</span></div>`+block(o.t)
  ).join(''));
</script>

<script src="consent.js?v=1" defer></script>
